services:

  mqtt-broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - raw-waveforms:${RAW_WAVEFORM_STORAGE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  django-channels:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # NOTE: requires an ASGI server (daphne/uvicorn) — not yet in pip-cache.
    # See end-of-session note. Command left explicit rather than guessed.
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  celery-worker-signal-processing:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q signal_processing --loglevel=info -n signal_processing@%h
    env_file: .env
    volumes:
      - ./backend:/app
      - raw-waveforms:${RAW_WAVEFORM_STORAGE_PATH}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-worker-ml-inference:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q ml_inference --loglevel=info -n ml_inference@%h
    env_file: .env
    volumes:
      - ./backend:/app
      - raw-waveforms:${RAW_WAVEFORM_STORAGE_PATH}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-worker-alerting:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q alerting --loglevel=info -n alerting@%h
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-worker-export:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A config worker -Q export --loglevel=info -n export@%h
    env_file: .env
    volumes:
      - ./backend:/app
      - raw-waveforms:${RAW_WAVEFORM_STORAGE_PATH}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ingestion-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: python manage.py run_ingestion
    env_file: .env
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: "1883"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
      - raw-waveforms:${RAW_WAVEFORM_STORAGE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt-broker:
        condition: service_started


  rpm-listener:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: python manage.py run_rpm_listener
    env_file: .env
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: "1883"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
      influxdb:
        condition: service_started
volumes:
  postgres-data:
  influxdb-data:
  redis-data:
  raw-waveforms:
  mosquitto-data:
  mosquitto-log:
